# cargo-mutants, run by `gates mutants` (L13, L14). A mutant of changed code that no test catches fails the gate unless
# it is excluded here, and every exclusion says why no test can catch it.

gitignore = true
# A mutant must be caught by any workspace test. `gates mutants` tests occam-xtask's own mutants on its own tests alone.
test_workspace = true
# Every test in one parallel pool, stopping at the first failure (.config/nextest.toml, profile `default`).
test_tool = "nextest"
# Optimised builds, so the tests a mutant runs take a fraction of the time; the same tests and assertions.
profile = "mutants"
# cargo-mutants times its baseline on the mutated packages only, so the timeout it derives can be shorter than one full
# workspace run, and a mutant no test catches would run out of time and count as caught (L13). This floor covers a full
# run with room to spare. A mutant that really hangs costs this much.
minimum_test_timeout = 300

exclude_globs = [
    # Process glue: it runs git, cargo and the tools. Every gate's real run exercises it; unit tests cannot.
    "crates/occam-xtask/src/repo.rs",
    "crates/occam-xtask/src/main.rs",
    # Measured by `gates perf`, whose record catches a change in what they compute. No test can.
    "crates/occam/benches/*.rs",
    "crates/occam-wasm/examples/*.rs",
]

# Each gate's `run` gathers its input through `repo` and is exercised by running the gate, not by unit tests; the rules
# it applies are in the module's pure functions, which are mutated. The same goes for `gates::main` and `usage`, and for
# `gates determinism`'s `levels`, which runs the probe and hands its output to `parsed_levels`.
exclude_re = [
    # The default is the empty slice, and so is this mutant: the same function, which no test can tell apart.
    "replace Parametric::degeneracies -> &\\[Degeneracy\\] with Vec::leak\\(Vec::new\\(\\)\\)",
    # occam-math's exp.rs, by line: an edit there moves them, and the gate then names the mutant again. Below 2^-54 in
    # magnitude e^x rounds to 1 on the main path as well, and so do 1 + x and 1 − x; Arm keeps the case only to raise no
    # spurious underflow.
    "exp\\.rs:242:13: replace < with (==|<=) in exp_one$",
    "exp\\.rs:243:20: replace \\+ with - in exp_one$",
    # At ±512 the scale is 2^±738.7, a double, and the care's powers of 2 scale it and back exactly: the same bits.
    "exp\\.rs:246:13: replace < with <= in exp_one$",
    # At y = 1, hi is 2 and lo under half of 2's ulp, so the rounded value is y.
    "exp\\.rs:230:22: replace < with <= in below$",
    # At ±2^-54 Taylor's polynomial gives x, x²/2 being under half an ulp of x; at ±2^-5 it gives the table's bits,
    # as both paths of tools/determinism/exp.py show.
    "exp\\.rs:260:27: replace < with <= in expm1_one$",
    "exp\\.rs:263:13: replace < with <= in expm1_one$",
    # occam-geom. Where the two sides of a comparison are equal, both branches give the same value: the smaller or
    # larger of two equal numbers, an end and a parameter at it, an angle at the start of its turn, and equal halves of a
    # span. In `refine`, a zero rate of change is the root, which Newton's step then leaves where it is, and a step onto
    # an end of the bracket, where the rate's sign is known, carries on from there as a step inside it would.
    "(turn|hyperbola)\\.rs:\\d+:\\d+: replace > with >= in larger$",
    "turn\\.rs:\\d+:\\d+: replace < with <= in (smaller|above)$",
    "hyperbola\\.rs:\\d+:\\d+: replace < with <= in smaller_larger$",
    "domain\\.rs:\\d+:\\d+: replace (< with <=|> with >=) in ParamRange::clamp$",
    "support\\.rs:\\d+:\\d+: replace > with >= in span$",
    "parabola\\.rs:\\d+:\\d+: replace (< with <=|> with >=) in <impl ParametricCurve for Parabola>::bounds$",
    "nearest\\.rs:\\d+:\\d+: replace < with <= in refine$",
    # By line. An arc holds `φ + π` where it holds `φ − π`, a whole turn away, which `above` takes off.
    "turn\\.rs:85:34: replace \\+ with - in arc_box$",
    # By line. Each changes only how much a search refines, and so only its speed: refining a piece where the slope does
    # not turn from falling to rising ends at one of its ends, which is no nearer than the nearest found.
    "nearest\\.rs:81:21: replace < with <= in nearest$",
    "nearest\\.rs:81:27: replace && with \\|\\| in nearest$",
    "replace run -> Verdict",
    "in run$",
    "replace (measure|browser|built|counts|summaries|levels) ",
    "in (measure|browser|built|counts|summaries|levels)$",
    "replace (main|usage) -> ExitCode",
    "in (main|usage)$",
]
