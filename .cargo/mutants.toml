# cargo-mutants, run by `gates mutants` (L13, L14). A mutant of changed code that no test catches fails the gate unless
# it is excluded here, and every exclusion says why no test can catch it. The gate, and `just preflight`, also refuse an
# `exclude_re` entry that excludes no mutant of the workspace, as one by line does once an edit moves its mutant: re-point
# it to the mutant's line, after reading that the code there is still equivalent, or drop it if the code is gone.

gitignore = true
# A mutant must be caught by any workspace test. `gates mutants` tests occam-xtask's own mutants on its own tests alone.
# Narrower scopes were measured and were no faster (docs/decisions/2026-11-14-mutants-keep-the-whole-workspace.md).
test_workspace = true
# Every test in one parallel pool, stopping at the first failure (.config/nextest.toml, profile `default`).
test_tool = "nextest"
# The test profile without debug info (Cargo.toml says why it is not optimised); the same tests and assertions.
profile = "mutants"
# `gates mutants` skips cargo-mutants' baseline, having run the unmutated suite itself, and passes `--timeout`: five
# times what that suite took, cargo-mutants' own default multiple, and never less than 300 seconds. Without it
# cargo-mutants 27.1.0 gives each mutant's tests 300 seconds whatever this floor says (tried with a floor of 77), and
# a mutant no test catches runs the whole suite: 137 s at most, with 3 jobs on a laptop, so a slower machine could
# run out of time and count it as caught (L13). This floor is for a run by hand with a baseline: cargo-mutants times
# that on the mutated packages only, so the timeout it derives can be shorter than one full workspace run. A mutant
# that really hangs costs the timeout.
minimum_test_timeout = 300

exclude_globs = [
    # Process glue: it runs git, cargo and the tools. Every gate's real run exercises it; unit tests cannot.
    "crates/occam-xtask/src/repo.rs",
    "crates/occam-xtask/src/main.rs",
    # Measured by `gates perf`, whose record catches a change in what they compute. No test can.
    "crates/occam/benches/*.rs",
    "crates/occam-wasm/examples/*.rs",
    # The topology's test models and helpers, which the tests build from: a mutant changes what a test builds, not the
    # kernel. They are compiled outside the tests only for the hidden probe and bench features, which nothing ships.
    "crates/occam-topo/src/models.rs",
    "crates/occam-topo/src/models/*.rs",
    "crates/occam-topo/src/testing.rs",
    # What `gates determinism` hashes and `gates perf` times: their records catch a change in what these compute.
    "crates/occam-topo/src/probe.rs",
    "crates/occam-topo/src/workloads.rs",
    "crates/occam-topo/examples/*.rs",
]

# Each gate's `run` gathers its input through `repo` and is exercised by running the gate, not by unit tests; the rules
# it applies are in the module's pure functions, which are mutated. The same goes for `gates::main` and `usage`, and for
# `gates determinism`'s `levels` and `runs_of`, which run the probes and hand their output to `parsed_levels` and
# `check`; `check` refuses a probe no build ran.
exclude_re = [
    # Where the order is the degree, `order` and `p` are the same number, so `<=` picks the same one.
    "replace < with <= in rows_len$",
    # The lower or higher of numbers that are equal is either: a tie gives the same number. A triangle's span, the
    # lower and higher of two parameters, a value already at an end of its window, and the largest coordinate of a box.
    "replace < with <= in Facet::span$",
    "replace > with >= in Facet::span$",
    "replace < with <= in ordered$",
    "replace < with <= in inside$",
    "replace > with >= in padded$",
    "foot\\.rs:\\d+:\\d+: replace > with >= in within$",
    "foot\\.rs:\\d+:\\d+: replace < with <= in within$",
    "replace > with >= in inside$",
    # A point as near as the best found is as good a foot: taking it or keeping the best gives the same distance.
    "replace < with <= in nearer$",
    "foot\\.rs:\\d+:\\d+: replace < with <= in foot$",
    "replace < with <= in <impl Parametric for MeshSurface>::invert$",
    # A lane beyond a value's lanes is never read: evaluating it or not changes only the speed.
    "replace match guard k < R::LANES with true in",
    "replace < with <= in [A-Za-z]+::rungs$",
    # Every lane evaluated alone gives the bits the lanes give together, by design: only the speed differs.
    "replace == with != in SplineCurve::rungs$",
    # A curve's rungs need 4p + 6 numbers to order 1, which six rows of room for 4 hold at degree 4 and of room for 8 at
    # degree 8 too: moving either edge by one changes only how much the stack zeroes.
    "replace < with (==|<=) in SplineCurve::at$",
    # Refining a sample nearer than its neighbours a second time, as this mutant does, finds what the first time found.
    "foot\\.rs:\\d+:\\d+: replace && with \\|\\| in foot$",
    # A sample is its own neighbour only in this mutant, and equal to itself, so it holds as before.
    "replace > with >= in lowest$",
    # A slope of exactly zero at an end: frozen or free, the parameter's step there is held at the end by the window.
    "replace > with >= in free$",
    "replace < with <= in free$",
    # Where `a` is 0, `det` is `-b * b`, never above 0, so the pivot test `a > 0` already fails on `det`.
    "foot\\.rs:57:16: replace > with >= in newton$",
    # The default is the empty slice, and so is this mutant: the same function, which no test can tell apart.
    "replace Parametric::degeneracies -> &\\[Degeneracy\\] with Vec::leak\\(Vec::new\\(\\)\\)",
    # occam-math's exp.rs, by line: an edit there moves them, and the gate then names the mutant again. Below 2^-54 in
    # magnitude e^x rounds to 1 on the main path as well, and so do 1 + x and 1 − x; Arm keeps the case only to raise no
    # spurious underflow.
    "exp\\.rs:242:13: replace < with (==|<=) in exp_one$",
    "exp\\.rs:243:20: replace \\+ with - in exp_one$",
    # At ±512 the scale is 2^±738.7, a double, and the care's powers of 2 scale it and back exactly: the same bits.
    "exp\\.rs:246:13: replace < with <= in exp_one$",
    # At y = 1, hi is 2 and lo under half of 2's ulp, so the rounded value is y.
    "exp\\.rs:230:22: replace < with <= in below$",
    # At ±2^-54 Taylor's polynomial gives x, x²/2 being under half an ulp of x; at ±2^-5 it gives the table's bits,
    # as both paths of tools/determinism/exp.py show.
    "exp\\.rs:260:27: replace < with <= in expm1_one$",
    "exp\\.rs:263:13: replace < with <= in expm1_one$",
    # occam-geom. Where the two sides of a comparison are equal, both branches give the same value: the smaller or
    # larger of two equal numbers, an end and a parameter at it, an angle at the start of its turn, and equal halves of a
    # span. In `refine`, a zero rate of change is the root, which Newton's step then leaves where it is, and a step onto
    # an end of the bracket, where the rate's sign is known, carries on from there as a step inside it would.
    "(turn|hyperbola)\\.rs:\\d+:\\d+: replace > with >= in larger$",
    "turn\\.rs:\\d+:\\d+: replace < with <= in (smaller|above)$",
    "hyperbola\\.rs:\\d+:\\d+: replace < with <= in smaller_larger$",
    "domain\\.rs:\\d+:\\d+: replace (< with <=|> with >=) in ParamRange::clamp$",
    "support\\.rs:\\d+:\\d+: replace > with >= in span$",
    "parabola\\.rs:\\d+:\\d+: replace (< with <=|> with >=) in <impl ParametricCurve for Parabola>::bounds$",
    "nearest\\.rs:\\d+:\\d+: replace < with <= in refine$",
    # Where the least `ρ` of a round meridian is exactly 0, either box holds it. On a cone's axis, its two lines through
    # the axis are as near, and every point of the circle at that `v` is a foot.
    "meridian\\.rs:\\d+:\\d+: replace < with <= in along_circle$",
    "cone\\.rs:\\d+:\\d+: replace < with <= in <impl Parametric for Cone>::invert$",
    # Axes read back. By line. The larger of two leans from square as large as each other is either. And unit axes
    # square to within 64 machine epsilons, as these must be before their handedness is asked, have a triple product
    # within a few dozen machine epsilons of 1 or -1, never nought, so `> 0` and `>= 0` tell right from left alike.
    "axes\\.rs:147:89: replace > with >= in Axes::restore$",
    "axes\\.rs:148:62: replace > with >= in Axes::restore$",
    # The gates' glue, as the comment above `exclude_re` says.
    "replace run -> Verdict",
    "in run$",
    "replace (measure|browser|built|counts|summaries|levels|runs_of) ",
    "in (measure|browser|built|counts|summaries|levels|runs_of)$",
    "replace (main|usage) -> ExitCode",
    # The swept step's (geometry.swept). Ties, which give the same value either way: the window that holds an anchor, the
    # part two windows share, the doubling that first passes a bound, and the box of a turned curve's part.
    "curve\\.rs:\\d+:\\d+: replace < with <= in holding$",
    "curve\\.rs:\\d+:\\d+: replace > with >= in holding$",
    "parabola\\.rs:\\d+:\\d+: replace > with >= in narrowed$",
    "parabola\\.rs:\\d+:\\d+: replace < with <= in narrowed$",
    "hyperbola\\.rs:\\d+:\\d+: replace > with >= in <impl ParametricCurve for Hyperbola>::within$",
    "replace > with >= in <impl Parametric for Revolution<C>>::bounds$",
    "replace < with <= in <impl Parametric for Revolution<C>>::bounds$",
    # `|a x + b y|` is `|a x - b y|`, for the perpendicular unit axes `x` and `y`.
    "hyperbola\\.rs:132:39: replace \\+ with - in <impl ParametricCurve for Hyperbola>::within$",
    # Exactly no bend, or no slope across it: that branch's bounds are NaN, which narrowing a window ignores.
    "parabola\\.rs:147:19: replace > with >= in <impl ParametricCurve for Parabola>::within$",
    "parabola\\.rs:154:18: replace > with >= in <impl ParametricCurve for Parabola>::within$",
    # No window or range has exactly one end finite: ranges are whole, trimmed at both ends, or without end both ways,
    # and a parabola's window narrows from both ends at once.
    "parabola\\.rs:159:25: replace && with \\|\\| in <impl ParametricCurve for Parabola>::within$",
    "swept\\.rs:\\d+:\\d+: replace && with \\|\\| in window$",
    # `side` is -1 or 1, never 0.
    "revolution\\.rs:\\d+:\\d+: replace < with <= in collapse$",
    # Refining more pieces, or one whose slope is exactly zero at a sample, which the piece before already refines to,
    # finds no point nearer than the minimum the search finds without them.
    "nearest\\.rs:69:21: replace < with <= in nearest_by$",
    "nearest\\.rs:69:27: replace && with \\|\\| in nearest_by$",
    # The measures step's (geometry.measures). Ties, which give the same value either way: a length's ends in order.
    "arc\\.rs:\\d+:\\d+: replace < with <= in length$",
    # By line where the operator is not alone in its function. Derivatives of equal length in order, and a spread of
    # exactly +0, whose root is +0: a tie, the same value either way. The larger of curvatures as large as each other.
    "local\\.rs:\\d+:\\d+: replace < with <= in no_plane$",
    "local\\.rs:158:26: replace > with >= in surface_local$",
    "local\\.rs:160:41: replace > with >= in surface_local$",
    # Ties, which give the same value either way: the larger of two lengths in `same` and `same_number`, and in a
    # surface join the farther of two feet and the running largest gap, angle and difference of curvatures.
    "continuity\\.rs:\\d+:\\d+: replace > with >= in same$",
    "continuity\\.rs:\\d+:\\d+: replace > with >= in same_number$",
    "continuity\\.rs:249:34: replace > with >= in measure_surfaces$",
    "continuity\\.rs:250:38: replace > with >= in measure_surfaces$",
    "continuity\\.rs:255:25: replace > with >= in measure_surfaces$",
    "continuity\\.rs:259:31: replace > with >= in measure_surfaces$",
    # Normals exactly square to each other are a quarter turn apart either way round, and such a join is G0 at best
    # whatever its curvatures. `flip` is exactly 1 or -1, so dividing by it is multiplying by it.
    "continuity\\.rs:\\d+:\\d+: replace < with <= in measure_surfaces$",
    "continuity\\.rs:257:57: replace \\* with / in measure_surfaces$",
    "continuity\\.rs:258:36: replace \\* with / in measure_surfaces$",
    # A chord of no length, or a point exactly at either end of it: 0 / 0, -0 and 1 give the same foot either way. Ends
    # in order that are equal. A guess exactly at either end of the range, or a Newton step exactly on either end of the
    # bracket, is taken where the middle would have been, which changes only how soon a length is found; and a gap of
    # exactly nought has already been returned.
    "spacing\\.rs:\\d+:\\d+: replace < with <= in from_chord$",
    "spacing\\.rs:\\d+:\\d+: replace > with >= in from_chord$",
    "spacing\\.rs:\\d+:\\d+: replace < with <= in ends$",
    "spacing\\.rs:116:27: replace > with >= in advance$",
    "spacing\\.rs:116:43: replace < with <= in advance$",
    "spacing\\.rs:123:16: replace < with <= in advance$",
    "spacing\\.rs:129:27: replace < with <= in advance$",
    "spacing\\.rs:129:46: replace < with <= in advance$",
    # Refining every sample with a neighbour no further, not only the local largest: more golden-section searches, each
    # of which can only find a point at least as far as the largest found without them. Not a tie; it changes the cost,
    # and where a narrow peak hides between two samples it finds what the samples miss, which no test can ask it not to.
    "spacing\\.rs:154:27: replace && with \\|\\| in furthest$",
    # The parameter step's (geometry.parameter). No range has exactly one end finite (`ParamRange`), so the stretch of
    # one is never taken.
    "uv_curve\\.rs:6[67]:\\d+: replace .* in stretch$",
    # The offset step's (geometry.offset). A lane-at-a-time evaluation that also evaluates the lane past those it returns,
    # at the padding (0, 0), changes only its speed: for a surface and for a curve.
    "offset_surface\\.rs:\\d+:\\d+: replace < with <= in <impl Parametric for OffsetSurface<S>>::eval_second$",
    "offset_curve\\.rs:\\d+:\\d+: replace < with <= in <impl ParametricCurve for OffsetCurve<C>>::eval_second$",
    # A parameter moved exactly to the part's start is at it either way.
    "trimmed_surface\\.rs:\\d+:\\d+: replace < with <= in into$",
    # The swept step's. A box's size is a sum of magnitudes from nought: taking each away instead gives exactly its
    # negative, and the margin it gives is taken as a magnitude.
    "extrusion\\.rs:123:111: replace \\+ with - in <impl Parametric for Extrusion<C>>::bounds$",
    # The splines step's. Ends in order that are equal.
    "spline_curve\\.rs:\\d+:\\d+: replace < with <= in <impl ParametricCurve for SplineCurve>::bounds$",
    # The checker step's (topology.checker). A search that meets each face once, and only faces the model holds, has
    # run out of faces by the time it has searched as many as the table has slots: one search more is never there to
    # make.
    "shell\\.rs:\\d+:\\d+: replace < with <= in reach$",
    # By line. Reading the edges of a shell that is new, whose faces the edit touched and so already reached, or of one
    # whose body is unchanged, which is all a check of an edge reads of its shell: more reads, the same failures.
    "scope\\.rs:209:37: replace && with \\|\\| in further$",
    # The geometric step's (topology.geometric). Ties, which give the same value either way: the farther of a
    # parameter's distances below and above its chart, the least of two clearances, and the largest deviation found so
    # far.
    "trace\\.rs:\\d+:\\d+: replace > with >= in Chart::beyond$",
    "trace\\.rs:\\d+:\\d+: replace < with <= in least$",
    "geometric\\.rs:\\d+:\\d+: replace > with >= in deviation$",
    # By line. A step whose arc comes exactly to the band at the far end of its bound is within it for certain; halved
    # again, the half holding the arc's nearest point still bounds it from below by no more than the band, so the least
    # clearance stays within it and a point there stays unsettled either way.
    "trace\\.rs:405:54: replace < with <= in Trace<'_>::refine$",
    # By line. One halving more than 24, which changes only how much a search refines: a step 2^-24 of the first strays
    # from its chord by about 2^-48 of what the first does, below a double's resolution of the distance to it, so it is
    # still unsure there only where the band and that distance agree to the last bit. Not a tie; no test can reach it.
    "trace\\.rs:406:55: replace < with <= in Trace<'_>::refine$",
    # The scale step's (topology.scale). A tie: an operation measured at one size alone is its own smallest and largest,
    # so it never grows.
    "perf\\.rs:\\d+:\\d+: replace < with <= in check_growth$",
    # The sweeps step's. By line. A cone's spread and rise are each more than the band from nought, so their quotient
    # has their product's sign.
    "around\\.rs:94:37: replace \\* with / in meridian$",
    # By line. A torus piece's `v` turns at 1 or -1 to its parameter, so dividing by that rate is multiplying by it.
    "around\\.rs:136:33: replace / with \\* in seams$",
    # By line. A profile point exactly the band out of the axis's plane, or beyond the axis: the band is the least
    # distance occam tells apart, so refusing it and taking it are both within the tolerance.
    "revolve\\.rs:98:21: replace > with >= in axes$",
    # A tie: where an arc turns at its high end, that end is the point, which is taken anyway.
    "revolve\\.rs:\\d+:\\d+: replace < with <= in furthest_on$",
    # The primitives step's (construction.primitives). By line. A torus's corners and circles are at angles of 0 and a
    # half turn alone, whose cosines are exactly 1 and -1, so dividing by the cosine is multiplying by it.
    "primitive/round\\.rs:206:27: replace \\* with / in torus$",
    "primitive/round\\.rs:213:64: replace \\* with / in torus$",
    "primitive/round\\.rs:218:42: replace \\* with / in torus$",
    # A cone's radii differ, as the reader holds them to, so the narrower is the lesser either way.
    "primitive/round\\.rs:\\d+:\\d+: replace < with <= in cone$",
    # By line. The circle in a cap's parameters is given unit directions at right angles: the primitive's `x` and `y`
    # turned into the cap's frame, each of them and their cross product exactly 1 long, so dividing by those lengths is
    # multiplying by them.
    "primitive/parts\\.rs:87:71: replace / with \\* in uv_circle$",
    "primitive/parts\\.rs:87:102: replace / with \\* in uv_circle$",
    # By line. A flat face's `x` need only lie along its first side, at any length: `axes` turns to it by the angle
    # `atan2` gives of two of its products, which its length scales alike, so only its direction counts. Its length
    # squared instead of 1 moves that angle by roundings alone.
    "primitive/polyhedron\\.rs:66:62: replace / with \\* in face_frame$",
    # The measure step's (construction.measure). Ties, which give the same value either way: the smaller and the larger
    # of two numbers, and a loop whose region in its parameters has no area, which counts nothing either way round.
    "occam-ops/src/measure\\.rs:\\d+:\\d+: replace > with >= in larger$",
    "measure/extent\\.rs:\\d+:\\d+: replace < with <= in smaller$",
    "measure/extent\\.rs:\\d+:\\d+: replace > with >= in larger$",
    "measure/mass\\.rs:\\d+:\\d+: replace < with <= in sums$",
    # Where each `G` starts along `u`: any start gives the same integral round a closed loop, as `dv` adds up to nothing
    # round it, so the least `u` the face reaches, which keeps each `G` within the surface's domain, is a choice.
    "measure/mass\\.rs:\\d+:\\d+: replace least -> f64 with ",
    "measure/mass\\.rs:\\d+:\\d+: replace < with <= in least$",
    # A direction exactly at the threshold of lying along a torus's axis, which reaches as far round whole circles.
    "measure/extent\\.rs:\\d+:\\d+: replace > with >= in turning$",
    # By line. A period from a range's start and end: every analytic family's angle runs from 0, as `turn()` gives it,
    # where its end less its start is its end plus its start.
    "measure/extent\\.rs:112:100: replace - with \\+ in interior$",
    # By line. The rule's nodes come in pairs either side of the middle, each pair with one weight, so taking each node
    # the other side of the middle sums the same evaluations in another order.
    "measure/quadrature\\.rs:73:37: replace \\+ with - in rule$",
    # The transform's. Ties, which give the same value either way: the lower and the higher of two equal numbers, a
    # patch's end at its range's end or a period from its start, and the largest of three factors where two are equal.
    "transform/moved\\.rs:\\d+:\\d+: replace < with <= in spread$",
    "transform/moved\\.rs:\\d+:\\d+: replace < with <= in within$",
    "transform/moved\\.rs:\\d+:\\d+: replace > with >= in within$",
    "affine\\.rs:85:67: replace > with >= in Affine::stretch$",
    # The orientation check's (the construction review's first finding). By line. A corner that turns by exactly
    # nought, of either sign, is a cusp taken either way: as no angle or as a whole turn, each within the cusp's band.
    "geometric/outward\\.rs:444:25: replace > with >= in spanned$",
    # A face's pieces in its plane. Ties, which give the same distance either way: the parameter of a point's foot on a
    # segment exactly 1, or exactly nought of either sign, taken as itself or as that end. The foot then differs at most
    # in a nought's sign, which the distance squares away.
    "construct/flat\\.rs:\\d+:\\d+: replace > with >= in Flat::distance$",
    # An arc that turns by exactly nought, of either sign, has no left to give a normal on. No loop has one: an edge's
    # range ends above where it starts, and its piece turns by that span times its sense, 1 or -1. A witness, the only
    # reader, moves off a piece by shares of its length, which for such an arc is nought.
    "construct/flat\\.rs:\\d+:\\d+: replace > with >= in Flat::at$",
    # By line. A face is the furthest place only where its sphere or torus reaches furthest along the axis, where its
    # normal lies along the axis: the normal's part along it is 1 or -1 to rounding, so dividing the whole turn by it is
    # multiplying by it. The same sign, as clear, and the same angle to within two units in its last place, which is as
    # well as the sum of angles is known: in the suites the part is exactly 1 or -1 at 12 of 14 such places, 1 - 2^-53
    # at the other two.
    "geometric/outward\\.rs:374:40: replace \\* with / in facing$",
    # A face's loops. By line. The remainder of a clearance by 4 for its quarter, as the sag a winding cuts arcs to.
    # Below 4 that is the whole clearance, and a chord strays from its arc by less than the sag (1 - cos x < x^2 / 2),
    # so it still never reaches the point, which is at least that far from the loop; from 4 up the arcs are cut finer.
    # The same winding from more or fewer samples. Not a tie: the quarter keeps a margin well above rounding, which
    # without it falls to a double's resolution only where the cut is as coarse as the sag allows and the point faces a
    # chord's middle, which no test can place, as a sine's last bit there differs by platform.
    "loops\\.rs:81:92: replace / with % in Loops<'a>::winding$",
    # The plane of a face's wires. By line. A unit normal no more than 1e-12 across the z axis has a z part within 1e-24
    # of 1 or -1, never 0, so no turn and the half turn are told apart by its sign alone.
    "construct/space\\.rs:35:17: replace > with >= in lift$",
    # Only a circle in the plane has its curve in the plane's parameters asked for, so its axes' normal is the plane's or
    # the opposite: their product is 1 or -1 within rounding, never 0.
    "construct/space\\.rs:\\d+:\\d+: replace < with <= in Flatland::pcurve$",
    # The mesh's limits (view.edges). Ties, which give the same value either way: the lower and the higher of two equal
    # numbers, from the one pair of helpers every bound, box and clamp of occam-mesh is decided by.
    "occam-mesh/src/limits\\.rs:\\d+:\\d+: replace < with <= in lower$",
    "occam-mesh/src/limits\\.rs:\\d+:\\d+: replace > with >= in higher$",
    # The closed forms' (intersection.closed). By line. A quotient's sign is the product's; `way` is 1 or -1, so
    # dividing by it is multiplying by it; and a cone's two rulings through its apex in a plane less steep than its
    # side are each other's mirror, both made, so taking the part across away instead of adding it swaps them.
    "closed/conic\\.rs:111:28: replace \\* with / in plane_cone$",
    "closed/conic\\.rs:132:94: replace \\* with / in through_apex$",
    "closed/conic\\.rs:132:79: replace \\+ with - in through_apex$",
    # Ties, which give the same value either way: a cosine or a difference of radii of exactly nought, which is its own
    # magnitude; two world axes as little along a normal, either square to it; a parabola's `d` times its slant exactly
    # nought, which only a plane through the apex has, decided before; and circles of one radius, which touch inside
    # each other only where they are one circle, decided before.
    "closed/conic\\.rs:93:33: replace < with <= in plane_cone$",
    "closed/conic\\.rs:111:36: replace > with >= in plane_cone$",
    "closed/meet\\.rs:116:16: replace < with <= in magnitude$",
    "closed/meet\\.rs:137:38: replace < with <= in circles$",
