# Policies enforced by clippy, not by review. `probes::clippy_rejects_every_banned_pattern` proves each one fires.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Lines of code; clippy counts no blank or comment line. `gates complexity` holds a lower bar with an exemption list.
too-many-lines-threshold = 100

# Applied to every crate. A crate outside the kernel that needs one allows it at its root, with a reason.
disallowed-types = [
    { path = "std::any::Any", reason = "no Any or downcasting across seams: closed enums within a family, open traits across families (L26)" },
    { path = "std::collections::HashMap", reason = "unspecified iteration order breaks determinism: use BTreeMap (L23)" },
    { path = "std::collections::HashSet", reason = "unspecified iteration order breaks determinism: use BTreeSet (L23)" },
]

# The one maths implementation (L23, docs/DETERMINISM.md): nothing computes a result that Rust does not pin down. Every
# one of these is documented as non-deterministic, is left to the optimiser, or rounds differently from its long form.
disallowed-methods = [
    { path = "f64::powi", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::powf", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::exp", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::exp2", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::ln", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::log", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::log2", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::log10", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::cbrt", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::hypot", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::sin", reason = "not bit-identical across targets: use occam_math::sin, which is (S5, L23)" },
    { path = "f64::cos", reason = "not bit-identical across targets: use occam_math::cos, which is (S5, L23)" },
    { path = "f64::tan", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::asin", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::acos", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::atan", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::atan2", reason = "not bit-identical across targets: use occam_math::atan2, which is (S5, L23)" },
    { path = "f64::sin_cos", reason = "not bit-identical across targets: use occam_math::sin_cos, which is (S5, L23)" },
    { path = "f64::exp_m1", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::ln_1p", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::sinh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::cosh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::tanh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::asinh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::acosh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::atanh", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::to_degrees", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::to_radians", reason = "not bit-identical across targets, and occam-math does not own it yet (S5, L23)" },
    { path = "f64::max", reason = "either zero may be returned for +0 and -0, which differs by target (L23)" },
    { path = "f64::min", reason = "either zero may be returned for +0 and -0, which differs by target (L23)" },
    { path = "f64::clamp", reason = "either zero may be returned for +0 and -0, which differs by target (L23)" },
    { path = "f64::algebraic_add", reason = "the optimiser may rewrite it, so its result depends on the build (L23)" },
    { path = "f64::algebraic_sub", reason = "the optimiser may rewrite it, so its result depends on the build (L23)" },
    { path = "f64::algebraic_mul", reason = "the optimiser may rewrite it, so its result depends on the build (L23)" },
    { path = "f64::algebraic_div", reason = "the optimiser may rewrite it, so its result depends on the build (L23)" },
    { path = "f64::algebraic_rem", reason = "the optimiser may rewrite it, so its result depends on the build (L23)" },
    { path = "f64::mul_add", reason = "it rounds once, so it changes results against `a * b + c` (rule 5, L23)" },
]

# `arithmetic_side_effects` passes these: IEEE floating-point arithmetic underneath, which cannot panic or overflow. A
# type of the crate being linted is named by its path inside that crate.
arithmetic-side-effects-allowed = [
    "lanes::Lanes",
    "occam_math::Lanes",
    "interval::Interval",
    "occam_math::Interval",
    "measure::Measure",
    "occam_units::Measure",
    "frame::Triple",
    "occam_units::Triple",
    "uv::Pair",
    "occam_units::Pair",
]
