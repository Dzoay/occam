[package]
name = "occam-topo"
description = "The B-rep: records in copy-on-write chunks, stable ids, the edit and its checker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
occam-geom = { path = "../occam-geom" }
occam-math = { path = "../occam-math" }
occam-report = { path = "../occam-report" }
occam-units = { path = "../occam-units" }

[features]
# A model read back without being measured or checked (`Restore::trusted`), for the browser's mesh workers, which trust
# the editing worker's check (docs/decisions/2026-11-16-mesh-workers-trust-the-editing-worker.md). Only occam-wasm turns
# it on, through occam's, which `gates layers` checks, so the `occam` command has no way to open a model unchecked.
trusted = []

[dev-dependencies]
occam-fixtures = { path = "../occam-fixtures" }

[lints]
workspace = true
