[package]
name = "occam"
description = "The composition crate: the one API every facade binds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
occam-geom = { path = "../occam-geom" }
occam-math = { path = "../occam-math" }
occam-report = { path = "../occam-report" }
occam-units = { path = "../occam-units" }

# Native only, because gungraun-runner does not compile for wasm and the benchmarks do not run there.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Pinned to the version of gungraun-runner in scripts/toolchain.sh, which must match. See docs/decisions/2026-11-09-gungraun.md.
gungraun = "=0.20.0"
# The topology's workloads for the benchmarks: plates built through `Edit` (`gates perf`).
occam-topo = { path = "../occam-topo", features = ["workloads"] }

[[bench]]
name = "operations"
harness = false

[lints]
workspace = true
