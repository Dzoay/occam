[package]
name = "occam-xtask"
description = "Developer tasks and the gates (never shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Every dependency here is in docs/decisions/2026-11-08-xtask-dependencies.md, and `gates deps` holds the list.
[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
toml = "1.2.1"

[lints]
workspace = true
