[package]
name = "occam-mesh"
description = "Tessellation: every shared edge sampled once, then each face against those samples, then the watertight check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
occam-geom = { path = "../occam-geom" }
occam-math = { path = "../occam-math" }
occam-report = { path = "../occam-report" }
occam-topo = { path = "../occam-topo" }
occam-units = { path = "../occam-units" }

[features]
# The determinism probe and the models it meshes, for `gates determinism` (examples/determinism.rs). Nothing that ships
# turns it on.
determinism = []

[[example]]
name = "determinism"
required-features = ["determinism"]

[lints]
workspace = true
