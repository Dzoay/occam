# cargo-nextest: every test in its own process, all test binaries in one parallel pool. Doctests are not nextest's; the
# `test` recipe runs them with `cargo test --doc`.

# `cargo nextest run` and the mutants gate: stop at the first failure and end the tests still running, so a caught
# mutant does not wait for the slowest in-flight test (L14).
[profile.default]
fail-fast = { max-fail = 1, terminate = "immediate" }

# The lint probes run clippy in a scratch workspace, and the compile-fail fixtures run rustc, seconds apiece, and catch
# no mutant of the gates. They run last, so a mutant a quick test catches fails before them. Order only: every test still
# runs.
[[profile.default.overrides]]
filter = "package(occam-xtask) & test(/^(probes|compile_fail)::/)"
priority = -10

# occam-mesh's tests that mesh whole faces, and occam-ops' that mesh every face construction makes, run after the unit
# tests: a mutant that sends refinement or flipping on without end then fails a quick test first, which ends the run,
# rather than holding every thread until the timeout.
[[profile.default.overrides]]
filter = "(package(occam-mesh) & test(/^faces::tests::/)) | (package(occam-ops) & test(/^meshed::/))"
priority = -5

# occam-intersect's sweep of P5's near-tangent pairs, 48 sections, runs after the unit tests too, so that a mutant of the
# hybrid fails a quick test first.
[[profile.default.overrides]]
filter = "package(occam-intersect) & test(/^resolution_tests::p5s_near_tangent/)"
priority = -5

# The gates and CI: run everything and report every failure.
[profile.ci]
fail-fast = false
