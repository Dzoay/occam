# What should not wait for a PR. The full corpus and randomised boolean sequences join this workflow as they arrive
# (docs/PLAN.md section 5). For now it notices a new advisory against a locked dependency, runs the OCCT oracle harness
# against its pinned wheel, a large download that the PR gates do not need, runs intersection's hits over the corpus,
# meshes the adversarial catalogue's plate with 1,024 holes, and runs the hybrid intersection on P5's 625-component
# surface, each minutes in a debug build.
name: nightly

on:
  schedule:
    - cron: "23 3 * * *" # daily at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: just cargo-deny
      - run: just advisories

  corpus:
    name: corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest
      - run: just corpus-hits

  mesh-holes:
    name: mesh-holes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest
      - run: just mesh-holes

  oracle:
    name: oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: just
      - name: uv, which runs the oracle harness
        run: pipx install "uv==0.13.7"
      - run: just oracle-test

  hybrid:
    name: hybrid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest
      - run: just hybrid-many-loops
